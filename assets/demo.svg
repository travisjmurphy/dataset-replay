<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Dataset Replay | Sample fixture</title><desc id="desc">Dataset Replay sample: the broken candidate has a blank price at line 3, a repeated B-209 key at line 4 and a zero price below 0.01 at line 5. It fails. Reordering the clean export passes.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF8F0" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1280" height="98" rx="0" fill="#15232C" stroke="none" stroke-width="0"/><g transform="translate(44 23) scale(0.8125)"><rect x="0" y="0" width="64" height="64" rx="13" fill="#B6E3A4" stroke="none" stroke-width="0"/><path d="M11 18 L33 18" fill="none" stroke="#15232C" stroke-width="4.9" stroke-linejoin="round" stroke-linecap="round" /><path d="M11 30 L27 30" fill="none" stroke="#15232C" stroke-width="4.9" stroke-linejoin="round" stroke-linecap="round" /><path d="M11 42 L21 42" fill="none" stroke="#15232C" stroke-width="4.9" stroke-linejoin="round" stroke-linecap="round" /><path d="M37 24 A13 13 0 1 1 31 43 M37 14 V25 H48" fill="none" stroke="#15232C" stroke-width="4.9" stroke-linejoin="round" stroke-linecap="round" /></g><text x="113" y="64" font-family="Liberation Sans,sans-serif" font-size="27" fill="#FAF8F0" font-weight="bold" text-anchor="start">Dataset Replay</text><text x="1232" y="59" font-family="Liberation Mono,monospace" font-size="17" fill="#B6E3A4" font-weight="bold" text-anchor="end">SAMPLE  /  DATA INTEGRITY</text><text x="44" y="185" font-family="Liberation Serif,serif" font-size="65" fill="#15232C" font-weight="normal" text-anchor="start">A passing export. Then a blank price.</text><text x="48" y="232" font-family="Liberation Sans,sans-serif" font-size="26" fill="#42525B" font-weight="normal" text-anchor="start">Two saved CSVs, matched by SKU. Three candidate lines tell the story.</text><rect x="48" y="271" width="1184" height="55" rx="0" fill="#15232C" stroke="none" stroke-width="0"/><text x="69" y="306" font-family="Liberation Mono,monospace" font-size="19" fill="#FAF8F0" font-weight="bold" text-anchor="start">CANDIDATE LINE</text><text x="320" y="306" font-family="Liberation Mono,monospace" font-size="19" fill="#FAF8F0" font-weight="bold" text-anchor="start">SKU</text><text x="548" y="306" font-family="Liberation Mono,monospace" font-size="19" fill="#FAF8F0" font-weight="bold" text-anchor="start">WHAT THE ROW SHOWS</text><rect x="48" y="326" width="1184" height="65" rx="0" fill="#B6E3A4" stroke="none" stroke-width="0"/><path d="M48 391 L1232 391" fill="none" stroke="#15232C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><text x="69" y="368" font-family="Liberation Mono,monospace" font-size="30" fill="#15232C" font-weight="bold" text-anchor="start">03</text><text x="320" y="368" font-family="Liberation Mono,monospace" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">B-209</text><text x="548" y="368" font-family="Liberation Sans,sans-serif" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">Required price_cad is blank.</text><rect x="48" y="391" width="1184" height="65" rx="0" fill="#FAF8F0" stroke="none" stroke-width="0"/><path d="M48 456 L1232 456" fill="none" stroke="#15232C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><text x="69" y="433" font-family="Liberation Mono,monospace" font-size="30" fill="#15232C" font-weight="bold" text-anchor="start">04</text><text x="320" y="433" font-family="Liberation Mono,monospace" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">B-209</text><text x="548" y="433" font-family="Liberation Sans,sans-serif" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">The same key already appears on line 3.</text><rect x="48" y="456" width="1184" height="65" rx="0" fill="#FAF8F0" stroke="none" stroke-width="0"/><path d="M48 521 L1232 521" fill="none" stroke="#15232C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><text x="69" y="498" font-family="Liberation Mono,monospace" font-size="30" fill="#15232C" font-weight="bold" text-anchor="start">05</text><text x="320" y="498" font-family="Liberation Mono,monospace" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">C-302</text><text x="548" y="498" font-family="Liberation Sans,sans-serif" font-size="26" fill="#15232C" font-weight="normal" text-anchor="start">Price is 0; the minimum is 0.01.</text><rect x="48" y="554" width="82" height="36" rx="3" fill="#15232C" stroke="none" stroke-width="0"/><text x="89.0" y="577" font-family="Liberation Mono,monospace" font-size="15" fill="#FAF8F0" font-weight="bold" text-anchor="middle">FAIL</text><text x="147" y="583" font-family="Liberation Sans,sans-serif" font-size="24" fill="#15232C" font-weight="bold" text-anchor="start">Broken export</text><rect x="601" y="554" width="82" height="36" rx="3" fill="#B6E3A4" stroke="none" stroke-width="0"/><text x="642.0" y="577" font-family="Liberation Mono,monospace" font-size="15" fill="#15232C" font-weight="bold" text-anchor="middle">PASS</text><text x="704" y="583" font-family="Liberation Sans,sans-serif" font-size="24" fill="#15232C" font-weight="bold" text-anchor="start">Clean export, reordered rows</text><path d="M48 630 L1232 630" fill="none" stroke="#15232C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="48" y="676" font-family="Liberation Mono,monospace" font-size="17" fill="#15232C" font-weight="bold" text-anchor="start">DEMO: BROKEN + CLEAN</text><text x="1232" y="676" font-family="Liberation Sans,sans-serif" font-size="22" fill="#42525B" font-weight="normal" text-anchor="end">Line numbers include the CSV header.</text></svg>
